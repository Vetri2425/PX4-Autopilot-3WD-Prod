name: Build px4_fmu-v6x_rover

on:
  workflow_dispatch:
  push:
    branches:
      - dyx-3wd-production
    paths-ignore:
      - 'CLAUDE.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    # Same pinned toolchain PX4's own release CI uses for this target (nuttx group),
    # per Tools/ci/generate_board_targets_json.py at this commit. A bare Ubuntu runner
    # with apt-installed gcc-arm-none-eabi produces slightly larger code and overflows
    # FLASH by ~16KB on px4_fmu-v6x_default even though the source is unmodified.
    container:
      image: ghcr.io/px4/px4-dev:v1.16.0-rc1-258-g0369abd556
    steps:
      - name: Git ownership workaround
        run: git config --system --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe` finds v1.17.0. A shallow, tagless
          # checkout makes PX4 report version 0.0.0, which QGC flags as unknown/unstable.
          fetch-depth: 0
          fetch-tags: true

      - name: Build px4_fmu-v6x_rover
        run: make px4_fmu-v6x_rover

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: px4_fmu-v6x_rover_firmware
          path: build/px4_fmu-v6x_rover/px4_fmu-v6x_rover.px4
